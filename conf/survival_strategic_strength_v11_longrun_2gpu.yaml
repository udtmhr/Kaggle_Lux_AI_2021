    checkpoint: /home/ueda/workspace/Kaggle_Lux_AI_2021_Fork/internal_testing/hall_of_fame/10-10_11-18-12_28576448/lux_ai/rl_agent/28576448_weights.pt
  - name: rule_economy
    kind: rule_based
    strategy: economy
    weight: 0.02
  - name: rule_survival
    kind: rule_based
    strategy: survival
    weight: 0.01
  - name: rule_expansion
    kind: rule_based
    strategy: expansion
    weight: 0.01
league_config_version: 6

# カリキュラム学習は継続
state_curriculum_enabled: true
snapshot_start_probability: 0.30
snapshot_pool_capacity: 2048
snapshot_capture_interval: 16

# Learner snapshotを500kステップ毎に更新
learner_snapshot_interval_steps: 500000

# 500kステップごとの中間チェックポイント
checkpoint_freq: 120.0

defaults:
- survival_strategic_strength_v3
- _self_

name: survival_strategic_strength_v4_stable

# Start a new policy-only stage from the evaluated 100k checkpoint.  The
# coordinator overrides stop_after_step at each evaluation milestone.
weights_only: true
total_steps: 300000
stop_after_step: null

# Abort before evaluation if an optimizer step, learner-to-actor sync, or saved
# checkpoint fails to change and preserve the policy tensors.
verify_model_updates: true

# The previous 100k -> 1M continuation drifted away from the teacher while its
# learning rate was still close to 1e-5.  Use a smaller fresh-optimizer stage.
optimizer_kwargs:
  lr: 2.0e-6
  eps: 3.0e-4
min_lr_mod: 0.10

# Keep the teacher anchor constant throughout this short stabilization stage.
teacher_kl_cost: 0.01
teacher_kl_cost_start: 0.01
teacher_kl_cost_end: 0.01
teacher_kl_cost_floor: 0.01
teacher_kl_decay_steps: 300000
teacher_kl_delay_steps: 0

# Conservative phase-aware shaping.  Terminal win/loss remains +/-1; shaping
# only supplies bounded survival/logistics credit between terminal outcomes.
reward_config_version: 4
reward_space: StrategicPotentialRewardV2
reward_space_kwargs:
  shaping_weight: 0.02
  shaping_floor: 0.005
  decay_games: 4000
  discounting: 0.999
  max_step_shaping: 0.02

# Keep auxiliary objectives disabled so this run isolates reward, league, LR,
# and teacher-anchor changes.
objective_config_version: 1
rule_aux_enabled: false
intent_aux_enabled: false

# Reserve 25% for the evaluated starting policy and 20% for first-place.  PFSP
# distributes the remaining mass across current/recent/historical opponents.
league_config_version: 5
league_sampling: pfsp
pfsp_power: 1.0
pfsp_teacher_floor: 0.25
pfsp_exploration: 0.05
pfsp_prior_games: 20
learner_snapshot_interval_steps: 100000
